<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#1A2230"/>
      <stop offset="55%" stop-color="#10151E"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
    <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="160" y1="160" x2="864" y2="864">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="382" fill="none" stroke="#1E242F" stroke-width="58"/>
  <!-- 細リング・85%消化（2πr≈2400, 85%≈2040）、¥ を大きく主役に -->
  <g transform="rotate(-90 512 512)">
    <circle cx="512" cy="512" r="382" fill="none" stroke="#2DD4BF" stroke-width="58"
      stroke-linecap="round" stroke-dasharray="2040 2400" opacity="0.5" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="382" fill="none" stroke="url(#teal)" stroke-width="58"
      stroke-linecap="round" stroke-dasharray="2040 2400"/>
  </g>
  <g stroke="url(#teal)" stroke-width="60" stroke-linecap="round" fill="none"
    transform="translate(512 512) scale(0.66) translate(-512 -532)">
    <path d="M330 268 L512 528"/>
    <path d="M694 268 L512 528"/>
    <path d="M512 528 L512 796"/>
    <path d="M368 592 L656 592"/>
    <path d="M368 706 L656 706"/>
  </g>
</svg>
